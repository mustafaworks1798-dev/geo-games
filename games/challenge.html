<body>

    <!-- ============================================ -->
    <!-- HEADER -->
    <!-- ============================================ -->
    <header>
        <a href="../index.html" class="logo">🌍 Geo Master</a>
        <div class="header-actions">
            <div class="score-board"><span id="lbl-score">Total Score</span>: <span id="score">0</span></div>

    <!-- ============================================ -->
    <!-- HEADER AD (HalalSpark) -->

        <!-- HalalSpark Enhanced Ad Script v3.0 - header -->

    <!-- ============================================ -->
    <!-- MAIN CONTENT -->
    <!-- ============================================ -->
    <main>
        <!-- Back Button -->
        <a href="../index.html" class="back-btn" id="back-btn">↩ Back</a>

        <!-- Game Section -->
        <div class="game-section">
            <h2 id="title-challenge">🏆 CHALLENGE (Silver)</h2>
            <div class="stats-bar">
                <div class="stat-item"><span id="lbl-streak-challenge">Current Streak</span>: 🔥 <span id="challenge-streak">0</span></div>
                <div class="stat-item">⚡ <span id="challenge-step-indicator">Step 1/3</span></div>
            </div>
            <div class="timer-display" id="challenge-timer"></div>
            <p id="sub-challenge" style="font-size:1rem; margin-bottom:0.5rem;">Answer 3 questions about the target country</p>
            <div id="challenge-target-display" style="font-size:1.8rem; font-weight:bold; color:var(--silver); margin:0.3rem 0;">---</div>

            <div id="challenge-step-container">
                <div class="challenge-step" id="challenge-step1">
                    <div class="step-title">1️⃣ Which is the correct flag?</div>
                    <div id="challenge-flags" class="options-grid"></div>
                </div>
                <div class="challenge-step" id="challenge-step2" style="display:none;">
                    <div class="step-title">2️⃣ Which is the correct map?</div>
                    <div id="challenge-maps" class="map-options-grid"></div>
                </div>
                <div class="challenge-step" id="challenge-step3" style="display:none;">
                    <div class="step-title">3️⃣ Which country shares a border with the target?</div>
                    <div id="challenge-borders" class="options-grid"></div>
                </div>
            </div>

            <div id="challenge-feedback" class="feedback" style="margin-top:0.6rem;"></div>
            <div id="challenge-progress" style="font-size:0.85rem; opacity:0.7; margin:0.4rem 0;">✅ 0/3 correct</div>
            <button id="challenge-next" class="btn-next" onclick="initGame()">Next ➔</button>
        </div>

        <!-- Banner Ad (after game) -->
        <div class="ad-container ad-banner" id="ad-banner" style="margin-top: 1rem;">
            <!-- HalalSpark Banner Ad will load here -->
        </div>
    </main>

        // Game state
        const gameState = {
            streak: 0,
            target: null,
            answered: false,
            timer: null,
            step: 0,
            correctCount: 0,
            failed: false,
            borderCorrect: null
        };

        // Restore streak
        gameState.streak = parseInt(localStorage.getItem('geo_challenge_current_streak')) || 0;

        // ============================================
        // I18N
        // ============================================
        const gameI18n = {
            ar: {
                title: "🏆 التحدّي (فضي)",
                sub: "أجب عن 3 أسئلة عن الدولة المستهدفة",

                back: "↩ رجوع",

                correct2: "✅ خريطة صحيحة!",
                correct3: "✅ حدود صحيحة!",

                wrong2: "❌ خريطة خاطئة",

                complete: "🎉 أكملت التحدي!",
                fail: "😞 فشل التحدي",

            },

                title: "🏆 CHALLENGE (Silver)",
                sub: "Answer 3 questions about the target country",
                streak: "Current Streak",
                back: "↩ Back",
                next: "Next ➔",
                correct1: "✅ Flag correct!",
                correct2: "✅ Map correct!",
                correct3: "✅ Border correct!",
                wrong1: "❌ Wrong flag",
                wrong2: "❌ Wrong map",
                wrong3: "❌ Wrong border",

                timeUp: "Time's Up! ⏰",
                penalty: "penalty",

                stepMap: "2️⃣ Which is the correct map?",

            },
            fr: {
                title: "🏆 DÉFI (Argent)",
                sub: "Répondez à 3 questions sur le pays cible",
                streak: "Série Actuelle",
                back: "↩ Retour",
                next: "Suivant ➔",
                correct1: "✅ Drapeau correct !",
                correct2: "✅ Carte correcte !",
                correct3: "✅ Frontière correcte !",
                wrong1: "❌ Mauvais drapeau",
                wrong2: "❌ Mauvaise carte",
                wrong3: "❌ Mauvaise frontière",
                complete: "🎉 Défi terminé !",
                fail: "😞 Défi échoué",
                timeUp: "Temps écoulé ! ⏰",
                penalty: "pénalité",
                stepFlag: "1️⃣ Quel est le bon drapeau ?",
                stepMap: "2️⃣ Quelle est la bonne carte ?",
                stepBorder: "3️⃣ Quel pays partage une frontière ?"
            }
        };

        function getGameText(key) {
            const lang = getSetting('lang', 'en');
            return (gameI18n[lang] || gameI18n['en'])[key] || key;
        }

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function getFlagUrl(code) {
            return 'https://flagcdn.com/w320/' + code.toLowerCase() + '.png';
        }

        function getIsolatedMapUrl(code) {
            return 'https://cdn.jsdelivr.net/gh/djaiss/mapsicon@master/all/' + code.toLowerCase() + '/vector.svg';
        }

        function getRandomCountry() {
            if (!allCountries || allCountries.length === 0) return null;
            return allCountries[Math.floor(Math.random() * allCountries.length)];
        }

        function getOptions(correct, count) {
            count = count || getSetting('optionsCount', 4);
            let options = [correct];
            let attempts = 0;
            while (options.length < count && attempts < 100) {
                let r = getRandomCountry();
                if (!options.find(o => o.code === r.code)) options.push(r);
                attempts++;
            }
            return options.sort(() => Math.random() - 0.5);
        }

        function getNeighbors(country) {
            const neighbors = borderData[country.code] || [];
            return neighbors.map(code => allCountries.find(c => c.code === code)).filter(c => c);
        }

        function getDifficultyMultiplier() {
            switch(getSetting('difficulty', 'medium')) {
                case 'easy': return 1;
                case 'hard': return 2;
                default: return 1.5;
            }
        }

        // ============================================
        // TIMER
        // ============================================
        function startTimer() {
            if (gameState.timer) clearInterval(gameState.timer);
            
            if (!getSetting('timerEnabled', true)) {
                document.getElementById('challenge-timer').innerText = '';
                return;
            }

            let timeLeft = getSetting('timerSeconds', 10);
            const timerEl = document.getElementById('challenge-timer');
            
            timerEl.innerText = '⏱️ ' + timeLeft + 's';
            timerEl.style.color = '#f59e0b';

            gameState.timer = setInterval(function() {
                timeLeft--;
                timerEl.innerText = '⏱️ ' + timeLeft + 's';
                if (timeLeft <= 3) timerEl.style.color = '#ef4444';
                else timerEl.style.color = '#f59e0b';
                
                if (timeLeft <= 0) {
                    clearInterval(gameState.timer);
                    gameState.timer = null;
                    timerEl.innerText = '⏰ Time\'s Up!';
                    handleTimeout();
                }
            }, 1000);
        }

        function clearTimer() {
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
        }

        function handleTimeout() {
            if (gameState.answered || gameState.failed) return;
            gameState.answered = true;
            gameState.failed = true;
            
            disableAll();
            penalizeScore(getSetting('timerPenalty', 10));
            
            document.getElementById('challenge-feedback').innerHTML = getGameText('timeUp') + ' ' + getGameText('fail') + ' (' + getGameText('penalty') + ' -' + getSetting('timerPenalty', 10) + ')';
            document.getElementById('challenge-next').innerText = getGameText('next');
            document.getElementById('challenge-next').style.display = 'inline-block';
        }

        function disableAll() {
            ['challenge-flags', 'challenge-maps', 'challenge-borders'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    const btns = el.getElementsByTagName('button');
                    for (let b of btns) b.disabled = true;
                    const cards = el.getElementsByClassName('map-option-card');
                    for (let c of cards) c.style.pointerEvents = 'none';
                }
            });
        }

        // ============================================
        // UI
        // ============================================
        function updateUI() {
            const lang = getSetting('lang', 'en');
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('title-challenge').innerText = getGameText('title');
            document.getElementById('sub-challenge').innerText = getGameText('sub');
            document.getElementById('lbl-streak-challenge').innerText = getGameText('streak');
            document.getElementById('back-btn').innerText = getGameText('back');
            document.getElementById('lbl-score').innerText = getTranslation().score;
            
            updateScoreDisplay();
            document.getElementById('challenge-streak').innerText = gameState.streak;
        }

        // ============================================
        // GAME LOGIC
        // ============================================
        function initGame() {
            gameState.answered = false;
            gameState.step = 0;
            gameState.correctCount = 0;
            gameState.failed = false;
            gameState.borderCorrect = null;
            clearTimer();
            
            gameState.target = getRandomCountry();
            if (!gameState.target) {
                setTimeout(initGame, 500);
                return;
            }
            
            const optsCount = getSetting('optionsCount', 4);
            
            document.getElementById('challenge-target-display').innerText = getCountryName(gameState.target);
            document.getElementById('challenge-feedback').innerHTML = '';
            document.getElementById('challenge-progress').innerHTML = '✅ 0/3 correct';
            document.getElementById('challenge-next').style.display = 'none';
            document.getElementById('challenge-step-indicator').innerText = 'Step 1/3';
            
            // Step 1: Flags
            document.getElementById('challenge-step1').style.display = 'block';
            document.getElementById('challenge-step2').style.display = 'none';
            document.getElementById('challenge-step3').style.display = 'none';
            
            document.querySelector('#challenge-step1 .step-title').innerText = getGameText('stepFlag');
            
            const flagContainer = document.getElementById('challenge-flags');
            flagContainer.className = 'options-grid ' + (optsCount === 6 ? 'grid-6' : '');
            flagContainer.innerHTML = '';
            
            const flagOpts = getOptions(gameState.target, optsCount);
            flagOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = '<img src="' + getFlagUrl(opt.code) + '" alt="Flag" loading="lazy">';
                btn.onclick = function() { checkFlag(btn, opt.code); };
                flagContainer.appendChild(btn);
            });
            
            document.getElementById('challenge-streak').innerText = gameState.streak;
            startTimer();
        }

        function checkFlag(btn, code) {
            if (gameState.answered || gameState.failed) return;
            
            disableAll();
            
            if (code === gameState.target.code) {
                btn.classList.add('correct');
                gameState.correctCount++;
                document.getElementById('challenge-feedback').innerHTML = getGameText('correct1');
                document.getElementById('challenge-progress').innerHTML = '✅ ' + gameState.correctCount + '/3 correct';
                document.getElementById('challenge-step-indicator').innerText = 'Step 2/3';
                
                setTimeout(function() {
                    document.getElementById('challenge-step1').style.display = 'none';
                    document.getElementById('challenge-step2').style.display = 'block';
                    document.querySelector('#challenge-step2 .step-title').innerText = getGameText('stepMap');
                    
                    const mapContainer = document.getElementById('challenge-maps');
                    const optsCount = getSetting('optionsCount', 4);
                    mapContainer.className = 'map-options-grid';
                    mapContainer.innerHTML = '';
                    
                    const mapOpts = getOptions(gameState.target, 4);
                    mapOpts.forEach(opt => {
                        const card = document.createElement('div');
                        card.className = 'map-option-card';
                        const img = document.createElement('img');
                        img.src = getIsolatedMapUrl(opt.code);
                        img.alt = 'Map';
                        img.loading = 'lazy';
                        card.appendChild(img);
                        card.onclick = function() { checkMap(card, opt.code); };
                        mapContainer.appendChild(card);
                    });
                }, 500);
            } else {
                gameState.failed = true;
                gameState.answered = true;
                btn.classList.add('wrong');
                penalizeScore(30);
                clearTimer();
                
                document.getElementById('challenge-feedback').innerHTML = getGameText('wrong1') + ' ❌ -30';
                document.getElementById('challenge-progress').innerHTML = '❌ Challenge Failed';
                document.getElementById('challenge-step-indicator').innerText = 'Failed';
                gameState.streak = 0;
                localStorage.setItem('geo_challenge_current_streak', 0);
                document.getElementById('challenge-streak').innerText = gameState.streak;
                document.getElementById('challenge-next').innerText = getGameText('next');
                document.getElementById('challenge-next').style.display = 'inline-block';
            }
        }

        function checkMap(card, code) {
            if (gameState.answered || gameState.failed) return;
            
            const cards = document.querySelectorAll('#challenge-maps .map-option-card');
            cards.forEach(c => c.style.pointerEvents = 'none');
            
            if (code === gameState.target.code) {
                card.classList.add('correct');
                gameState.correctCount++;
                document.getElementById('challenge-feedback').innerHTML = getGameText('correct2');
                document.getElementById('challenge-progress').innerHTML = '✅ ' + gameState.correctCount + '/3 correct';
                document.getElementById('challenge-step-indicator').innerText = 'Step 3/3';
                
                setTimeout(function() {
                    document.getElementById('challenge-step2').style.display = 'none';
                    document.getElementById('challenge-step3').style.display = 'block';
                    document.querySelector('#challenge-step3 .step-title').innerText = getGameText('stepBorder');
                    
                    const borderContainer = document.getElementById('challenge-borders');
                    const optsCount = getSetting('optionsCount', 4);
                    borderContainer.className = 'options-grid ' + (optsCount === 6 ? 'grid-6' : '');
                    borderContainer.innerHTML = '';
                    
                    let neighbors = getNeighbors(gameState.target);
                    let correctNeighbor;
                    
                    if (neighbors.length > 0) {
                        correctNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                    } else {
                        correctNeighbor = getRandomCountry();
                        while (correctNeighbor.code === gameState.target.code) {
                            correctNeighbor = getRandomCountry();
                        }
                    }
                    
                    gameState.borderCorrect = correctNeighbor.code;
                    
                    let options = [correctNeighbor];
                    let attempts = 0;
                    while (options.length < optsCount && attempts < 100) {
                        let r = getRandomCountry();
                        if (r.code !== gameState.target.code && r.code !== correctNeighbor.code && !options.find(o => o.code === r.code)) {
                            options.push(r);
                        }
                        attempts++;
                    }
                    options.sort(() => Math.random() - 0.5);
                    
                    options.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.innerText = getCountryName(opt);
                        btn.onclick = function() { checkBorder(btn, opt.code); };
                        borderContainer.appendChild(btn);
                    });
                }, 500);
            } else {
                gameState.failed = true;
                gameState.answered = true;
                card.classList.add('wrong');
                penalizeScore(30);
                clearTimer();
                
                document.getElementById('challenge-feedback').innerHTML = getGameText('wrong2') + ' ❌ -30';
                document.getElementById('challenge-progress').innerHTML = '❌ Challenge Failed';
                document.getElementById('challenge-step-indicator').innerText = 'Failed';
                gameState.streak = 0;
                localStorage.setItem('geo_challenge_current_streak', 0);
                document.getElementById('challenge-streak').innerText = gameState.streak;
                document.getElementById('challenge-next').innerText = getGameText('next');
                document.getElementById('challenge-next').style.display = 'inline-block';
            }
        }

        function checkBorder(btn, code) {
            if (gameState.answered || gameState.failed) return;
            
            disableAll();
            
            if (code === gameState.borderCorrect) {
                btn.classList.add('correct');
                gameState.correctCount++;
                gameState.answered = true;
                clearTimer();
                
                const multiplier = getDifficultyMultiplier();
                const pts = Math.round(60 * multiplier);
                addScore(pts);
                
                gameState.streak++;
                if (updateBestStreak('challenge', gameState.streak)) {}
                localStorage.setItem('geo_challenge_current_streak', gameState.streak);
                
                document.getElementById('challenge-feedback').innerHTML = getGameText('complete') + ' +' + pts;
                document.getElementById('challenge-progress').innerHTML = '✅ ' + gameState.correctCount + '/3 correct';
                document.getElementById('challenge-step-indicator').innerText = '🏆 Completed!';
            } else {
                gameState.failed = true;
                gameState.answered = true;
                btn.classList.add('wrong');
                penalizeScore(30);
                clearTimer();
                
                document.getElementById('challenge-feedback').innerHTML = getGameText('wrong3') + ' ❌ -30';
                document.getElementById('challenge-progress').innerHTML = '❌ Challenge Failed';
                document.getElementById('challenge-step-indicator').innerText = 'Failed';
                gameState.streak = 0;
                localStorage.setItem('geo_challenge_current_streak', 0);
            }
            
            document.getElementById('challenge-streak').innerText = gameState.streak;
            document.getElementById('challenge-next').innerText = getGameText('next');
            document.getElementById('challenge-next').style.display = 'inline-block';
        }

        // ============================================
        // SETTINGS CHANGE HANDLER
        // ============================================
        const originalApplySettingsChange = window.applySettingsChange;
        if (originalApplySettingsChange) {
            window.applySettingsChange = function() {
                originalApplySettingsChange();
                updateUI();
            };
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        async function initialize() {
            if (!allCountries || allCountries.length === 0) {
                await loadCountries();
            }
            
            updateUI();
            initGame();
        }

        document.addEventListener('DOMContentLoaded', function() {
            initialize();
        });
    </script>

</body>
</html>
