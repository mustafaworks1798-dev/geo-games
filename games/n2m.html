<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guess the country map shape from its name!">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Geo Master">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%234f46e5' width='192' height='192' rx='45'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>🌍</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%234f46e5' width='192' height='192' rx='45'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>🌍</text></svg>">
    <title>Geo Master</title>
    
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://flagcdn.com" crossorigin>
    <link rel="preconnect" href="https://ads.halalspark.co.uk" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ============================================ -->
    <!-- HEADER -->
    <!-- ============================================ -->
    <header>
        <a href="../index.html" class="logo">🌍 Geo Master</a>
        <div class="header-actions">
            <div class="score-board"><span id="lbl-score">Total Score</span>: <span id="score">0</span></div>
            <button class="settings-btn achievements-btn" onclick="openAchievements()" title="Achievements">🏆</button>
            <button class="settings-btn" onclick="openGamesMenu()" title="Games List">📋</button>
            <button class="settings-btn" onclick="openSettingsModal()" title="Settings">⚙️</button>
        </div>
    </header>

    <!-- ============================================ -->
    <!-- HEADER AD (HalalSpark) -->
    <!-- ============================================ -->
    <script src="https://ads.halalspark.co.uk/get-auto-ads-script?websiteId=c1916d82-0197-497a-95af-c5129d457f00&profile=ade" async></script>

    <!-- ============================================ -->
    <!-- MAIN CONTENT -->
    <!-- ============================================ -->
    <main>
        <!-- Back Button -->
        <a href="../index.html" class="back-btn" id="back-btn">↩ Back</a>

        <!-- Banner Ad (inside main, before game) -->

        <!-- Game Section -->
        <div class="game-section">
            <h2 id="title-n2m">Guess Map from Name</h2>
            <div class="stats-bar">
                <div class="stat-item"><span id="lbl-streak-n2m">Current Streak</span>: 🔥 <span id="n2m-streak">0</span></div>
            </div>
            <div class="timer-display" id="n2m-timer"></div>
            <p id="sub-n2m">Select the correct map shape for:</p>
            <h1 id="n2m-target-name" style="color: #818cf8; margin: 0.4rem 0; font-size: 1.4rem;">---</h1>
            <div id="n2m-options" class="map-options-grid"></div>
            <div id="n2m-feedback" class="feedback"></div>
            <button id="n2m-next" class="btn-next" onclick="initGame()">Next ➔</button>
        </div>
    </main>

    <!-- ============================================ -->
    <!-- FOOTER AD (HalalSpark) -->
    <!-- ============================================ -->


    <!-- ============================================ -->
    <!-- FOOTER -->
    <!-- ============================================ -->
    <footer>
        <p>🌍 Geo Master &copy; 2026</p>
    </footer>

    <!-- ============================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================ -->
    <script src="../script.js"></script>
    <script>
        /* ============================================
           N2M GAME SCRIPT
           Name → Map Quiz
           ============================================ */

        // Game state
        const gameState = {
            streak: 0,
            target: null,
            answered: false,
            timer: null
        };

        // Restore streak from localStorage
        gameState.streak = parseInt(localStorage.getItem('geo_n2m_current_streak')) || 0;

        // ============================================
        // I18N FOR THIS GAME
        // ============================================
        const gameI18n = {
            ar: {
                title: "تخمين الخريطة من الاسم",
                sub: "اختر شكل الخريطة الصحيح للدولة التالية:",
                streak: "التتابع الحالي",
                back: "↩ رجوع",
                next: "التالي ➔",
                correct: "إجابة صحيحة! ✅",
                wrong: "خطأ! الإجابة الصحيحة هي: ❌",
                timeUp: "انتهى الوقت! ⏰",
                penalty: "خصم"
            },
            en: {
                title: "Guess Map from Name",
                sub: "Select the correct map shape for:",
                streak: "Current Streak",
                back: "↩ Back",
                next: "Next ➔",
                correct: "Correct Answer! ✅",
                wrong: "Wrong! Correct answer is: ❌",
                timeUp: "Time's Up! ⏰",
                penalty: "penalty"
            },
            fr: {
                title: "Devinez la carte depuis le nom",
                sub: "Sélectionnez la forme correcte pour :",
                streak: "Série Actuelle",
                back: "↩ Retour",
                next: "Suivant ➔",
                correct: "Bonne réponse ! ✅",
                wrong: "Faux ! La bonne réponse est : ❌",
                timeUp: "Temps écoulé ! ⏰",
                penalty: "pénalité"
            }
        };

        function getGameText(key) {
            const lang = getSetting('lang', 'en');
            return (gameI18n[lang] || gameI18n['en'])[key] || key;
        }

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function getIsolatedMapUrl(code) {
            return 'https://cdn.jsdelivr.net/gh/djaiss/mapsicon@master/all/' + code.toLowerCase() + '/vector.svg';
        }

        function getRandomCountry() {
            if (!allCountries || allCountries.length === 0) return null;
            return allCountries[Math.floor(Math.random() * allCountries.length)];
        }

        function getMapOptions(correct) {
            // Always 4 map options to fit the grid well
            const count = 4;
            let options = [correct];
            let attempts = 0;
            while (options.length < count && attempts < 100) {
                let r = getRandomCountry();
                if (!options.find(o => o.code === r.code)) options.push(r);
                attempts++;
            }
            return options.sort(() => Math.random() - 0.5);
        }

        function getDifficultyMultiplier() {
            switch(getSetting('difficulty', 'medium')) {
                case 'easy': return 1;
                case 'hard': return 2;
                default: return 1.5;
            }
        }

        // ============================================
        // TIMER FUNCTIONS
        // ============================================
        function startTimer() {
            if (gameState.timer) clearInterval(gameState.timer);
            
            if (!getSetting('timerEnabled', true)) {
                document.getElementById('n2m-timer').innerText = '';
                return;
            }

            let timeLeft = getSetting('timerSeconds', 10);
            const timerEl = document.getElementById('n2m-timer');
            
            timerEl.innerText = '⏱️ ' + timeLeft + 's';
            timerEl.style.color = '#f59e0b';

            gameState.timer = setInterval(function() {
                timeLeft--;
                timerEl.innerText = '⏱️ ' + timeLeft + 's';
                if (timeLeft <= 3) timerEl.style.color = '#ef4444';
                else timerEl.style.color = '#f59e0b';
                
                if (timeLeft <= 0) {
                    clearInterval(gameState.timer);
                    gameState.timer = null;
                    timerEl.innerText = '⏰ Time\'s Up!';
                    handleTimeout();
                }
            }, 1000);
        }

        function clearTimer() {
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
        }

        function handleTimeout() {
            if (gameState.answered) return;
            gameState.answered = true;
            
            disableAllCards();
            penalizeScore(getSetting('timerPenalty', 10));
            
            const targetName = getCountryName(gameState.target);
            const feedbackEl = document.getElementById('n2m-feedback');
            feedbackEl.innerHTML = getGameText('timeUp') + ' ' + getGameText('wrong') + ' ' + targetName + ' (' + getGameText('penalty') + ' -' + getSetting('timerPenalty', 10) + ')';
            
            const nextBtn = document.getElementById('n2m-next');
            nextBtn.innerText = getGameText('next');
            nextBtn.style.display = 'inline-block';
        }

        // ============================================
        // UI FUNCTIONS
        // ============================================
        function disableAllCards() {
            const cards = document.querySelectorAll('.map-option-card');
            cards.forEach(function(c) { c.style.pointerEvents = 'none'; });
        }

        function updateUI() {
            const lang = getSetting('lang', 'en');
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('title-n2m').innerText = getGameText('title');
            document.getElementById('sub-n2m').innerText = getGameText('sub');
            document.getElementById('lbl-streak-n2m').innerText = getGameText('streak');
            document.getElementById('back-btn').innerText = getGameText('back');
            document.getElementById('lbl-score').innerText = getTranslation().score;
            
            updateScoreDisplay();
            document.getElementById('n2m-streak').innerText = gameState.streak;
        }

        // ============================================
        // GAME LOGIC
        // ============================================
        function initGame() {
            gameState.answered = false;
            clearTimer();
            
            // Get a random target country
            gameState.target = getRandomCountry();
            if (!gameState.target) {
                // Countries not loaded yet, try again
                setTimeout(initGame, 500);
                return;
            }
            
            const options = getMapOptions(gameState.target);
            
            // Set target country name
            document.getElementById('n2m-target-name').innerText = getCountryName(gameState.target);
            
            // Clear feedback and hide next button
            document.getElementById('n2m-feedback').innerHTML = '';
            document.getElementById('n2m-next').style.display = 'none';
            
            // Render map option cards
            const container = document.getElementById('n2m-options');
            container.className = 'map-options-grid';
            container.innerHTML = '';
            
            options.forEach(function(opt) {
                const card = document.createElement('div');
                card.className = 'map-option-card';
                card.onclick = function() { checkAnswer(card, opt.code); };
                
                const img = document.createElement('img');
                img.src = getIsolatedMapUrl(opt.code);
                img.alt = 'Country Map';
                img.loading = 'lazy';
                
                card.appendChild(img);
                container.appendChild(card);
            });
            
            // Update streak display
            document.getElementById('n2m-streak').innerText = gameState.streak;
            
            // Start timer
            startTimer();
        }

        function checkAnswer(selectedCard, code) {
            if (gameState.answered) return;
            gameState.answered = true;
            
            clearTimer();
            disableAllCards();
            
            const target = gameState.target;
            const feedbackEl = document.getElementById('n2m-feedback');
            
            if (code === target.code) {
                // CORRECT!
                selectedCard.classList.add('correct');
                const multiplier = getDifficultyMultiplier();
                const pts = Math.round(25 * multiplier);
                addScore(pts);
                
                gameState.streak++;
                if (updateBestStreak('n2m', gameState.streak)) {
                    // Best streak updated
                }
                localStorage.setItem('geo_n2m_current_streak', gameState.streak);
                
                feedbackEl.innerHTML = getGameText('correct') + ' +' + pts;
            } else {
                // WRONG!
                selectedCard.classList.add('wrong');
                gameState.streak = 0;
                localStorage.setItem('geo_n2m_current_streak', 0);
                penalizeScore(30);
                
                // Highlight correct answer
                const cards = document.querySelectorAll('.map-option-card');
                const options = getMapOptions(target);
                cards.forEach(function(card, index) {
                    if (options[index] && options[index].code === target.code) {
                        card.classList.add('correct');
                    }
                });
                
                const targetName = getCountryName(target);
                feedbackEl.innerHTML = getGameText('wrong') + ' ' + targetName + ' (-30)';
            }
            
            document.getElementById('n2m-streak').innerText = gameState.streak;
            
            const nextBtn = document.getElementById('n2m-next');
            nextBtn.innerText = getGameText('next');
            nextBtn.style.display = 'inline-block';
        }

        // ============================================
        // SETTINGS CHANGE HANDLER
        // ============================================
        const originalApplySettingsChange = window.applySettingsChange;
        if (originalApplySettingsChange) {
            window.applySettingsChange = function() {
                originalApplySettingsChange();
                updateUI();
            };
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        async function initialize() {
            // Load countries if not already loaded
            if (!allCountries || allCountries.length === 0) {
                await loadCountries();
            }
            
            updateUI();
            initGame();
        }

        document.addEventListener('DOMContentLoaded', function() {
            initialize();
        });
    </script>

</body>
</html>
