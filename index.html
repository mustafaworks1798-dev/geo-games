<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Master geography with interactive quizzes! Guess countries from maps, flags, capitals, and emoji riddles.">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Geo Master">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%234f46e5' width='192' height='192' rx='45'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>🌍</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%234f46e5' width='192' height='192' rx='45'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>🌍</text></svg>">
    <title>Geo Master</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://flagcdn.com" crossorigin>
    <link rel="preconnect" href="https://ads.halalspark.co.uk" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ============================================ -->
    <!-- HEADER -->
    <!-- ============================================ -->
    <header>
        <a href="index.html" class="logo">🌍 Geo Master</a>
        <div class="header-actions">
            <div class="score-board"><span id="lbl-score">Total Score</span>: <span id="score">0</span></div>
            <button class="settings-btn achievements-btn" onclick="openAchievements()" title="Achievements">🏆</button>
            <button class="settings-btn" onclick="openGamesMenu()" title="Games List">📋</button>
            <button class="settings-btn" onclick="openSettingsModal()" title="Settings">⚙️</button>
        </div>
    </header>

    <!-- ============================================ -->
    <!-- HEADER AD (HalalSpark) -->
    <!-- ============================================ 
    <!-- HalalSpark Auto Ads — ade -->
    <script src="https://ads.halalspark.co.uk/get-auto-ads-script?websiteId=c1916d82-0197-497a-95af-c5129d457f00&profile=ade&test=1" async></script>

    <!-- ============================================ -->
    <!-- NAVIGATION -->
    <!-- ============================================ -->
    <nav id="main-nav"></nav>

    <!-- ============================================ -->
    <!-- BANNER AD (HalalSpark) -->
    <!-- ============================================ -->

    <!-- ============================================ -->
    <!-- MAIN CONTENT -->
    <!-- ============================================ -->
    <main>
        <!-- Welcome Section -->
        <div class="game-section" style="margin-bottom: 1rem;">
            <h2 id="home-title" style="color: #818cf8; margin-bottom: 0.5rem;">🌍 Geo Master - Choose a Game</h2>
            <p id="home-subtitle" style="opacity: 0.8;">Select a game to start testing your geography knowledge!</p>
        </div>

        <!-- Games Grid -->
        <div class="games-grid" id="games-grid">
            <!-- Generated by JavaScript -->
        </div>

        <!-- Best Performance Dashboard -->
        <div class="best-performance-card">
            <h3 id="title-dash">🏆 Best Performance Dashboard</h3>
            <div class="perf-grid" id="dash-grid">
                <!-- Generated by JavaScript -->
            </div>
        </div>
    </main>

    <!-- ============================================ -->
    <!-- FOOTER AD (HalalSpark) -->
    <!-- ============================================ -->

    <!-- ============================================ -->
    <!-- FOOTER -->
    <!-- ============================================ -->
    <footer>
        <p>🌍 Geo Master &copy; 2026 - Test your geography knowledge!</p>
    </footer>

    <!-- ============================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================ -->
    <script src="script.js"></script>
    <script>
        /* ============================================
           INDEX PAGE SPECIFIC SCRIPT
           ============================================ */

        // Dashboard metrics definition
        const dashMetrics = [
            { id: 'm2n', icon: '🗺️➔🔤', labelKey: 'btnM2N' },
            { id: 'n2m', icon: '🔤➔🗺️', labelKey: 'btnN2M' },
            { id: 'name', icon: '🚩', labelKey: 'btnName' },
            { id: 'flag', icon: '🌐', labelKey: 'btnFlag' },
            { id: 'riddle', icon: '🧩', labelKey: 'btnRiddle' },
            { id: 'cap2c', icon: '🏛️➔🌍', labelKey: 'btnCap2C' },
            { id: 'c2cap', icon: '🌍➔🏛️', labelKey: 'btnC2Cap' },
            { id: 'pop', icon: '👥', labelKey: 'btnPop' },
            { id: 'area', icon: '📏', labelKey: 'btnArea' },
            { id: 'challenge', icon: '🏆', labelKey: 'btnChallenge', isSilver: true }
        ];

        // Render games grid
        function renderGamesGrid() {
            const t = getTranslation();
            const grid = document.getElementById('games-grid');
            if (!grid) return;
            
            grid.innerHTML = '';
            
            gamesList.forEach(g => {
                const card = document.createElement('a');
                card.className = 'game-card' + (g.id === 'challenge' ? ' silver-card' : '');
                card.href = 'games/' + g.file;
                
                const icon = document.createElement('span');
                icon.className = 'game-icon';
                // Extract emoji from label or use default
                const metric = dashMetrics.find(m => m.id === g.id);
                icon.innerText = metric ? metric.icon.split(' ')[0] : '🎮';
                
                const title = document.createElement('span');
                title.className = 'game-title';
                title.innerText = t[g.labelKey] || g.id;
                
                const badge = document.createElement('span');
                badge.className = 'game-badge';
                badge.innerText = g.id === 'challenge' ? '⭐ Silver' : '▶ Play';
                
                card.appendChild(icon);
                card.appendChild(title);
                card.appendChild(badge);
                
                grid.appendChild(card);
            });
        }

        // Render dashboard
        function renderDashboard() {
            const t = getTranslation();
            const dashGrid = document.getElementById('dash-grid');
            if (!dashGrid) return;
            
            dashGrid.innerHTML = '';
            
            dashMetrics.forEach(metric => {
                const best = getBestStreak(metric.id);
                
                const item = document.createElement('div');
                item.className = 'perf-item';
                if (metric.isSilver) {
                    item.style.borderColor = 'var(--silver)';
                }
                
                const iconSpan = document.createElement('span');
                iconSpan.className = 'icon';
                iconSpan.innerText = metric.icon;
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'title';
                // Use shortened version of label for dashboard
                const fullLabel = t[metric.labelKey] || metric.id;
                titleSpan.innerText = fullLabel.replace(/^[^\s]+\s/, '').substring(0, 25);
                
                const valueSpan = document.createElement('span');
                valueSpan.className = 'value';
                valueSpan.id = 'dash-best-' + metric.id;
                valueSpan.innerText = best + ' ' + t.consecutive;
                
                item.appendChild(iconSpan);
                item.appendChild(titleSpan);
                item.appendChild(valueSpan);
                
                dashGrid.appendChild(item);
            });
        }

        // Render navigation
        function renderNav() {
            const t = getTranslation();
            const nav = document.getElementById('main-nav');
            if (!nav) return;
            
            nav.innerHTML = '';
            
            // Show favorites if any, otherwise show all
            const favs = getFavorites();
            const toShow = favs.length > 0 ? gamesList.filter(g => favs.includes(g.id)) : gamesList;
            
            toShow.forEach(g => {
                const btn = document.createElement('a');
                const isSilver = g.id === 'challenge';
                btn.className = 'nav-btn' + (isSilver ? ' silver-btn' : '');
                btn.href = 'games/' + g.file;
                btn.innerText = t[g.labelKey] || g.id;
                nav.appendChild(btn);
            });
            
            // "All Games" button
            const allBtn = document.createElement('button');
            allBtn.className = 'nav-btn nav-btn-menu';
            allBtn.innerText = t.allGamesBtn;
            allBtn.onclick = function() { openGamesMenu(); };
            nav.appendChild(allBtn);
        }

        // Update all UI
        function updateUI() {
            const t = getTranslation();
            
            document.getElementById('home-title').innerText = t.homeTitle;
            document.getElementById('home-subtitle').innerText = t.homeSubtitle;
            document.getElementById('title-dash').innerText = t.dashTitle;
            document.getElementById('lbl-score').innerText = t.score;
            
            updateScoreDisplay();
            renderGamesGrid();
            renderDashboard();
            renderNav();
        }

        // Listen for language changes from settings modal
        const originalApplySettingsChange = window.applySettingsChange;
        if (originalApplySettingsChange) {
            window.applySettingsChange = function() {
                originalApplySettingsChange();
                updateUI();
            };
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            updateUI();
        });
    </script>

</body>
</html>
